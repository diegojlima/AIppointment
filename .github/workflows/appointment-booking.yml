name: Appointment System CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy_infrastructure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies and Package Lambda
        run: |
          cd functions/appointment-booking
          chmod +x build_lambda.sh
          ./build_lambda.sh

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Create Terraform State Resources
        run: |
          # Check if the S3 bucket already exists
          if ! aws s3api head-bucket --bucket delima-aippointment-terraform-state 2>/dev/null; then
            echo "Creating S3 bucket for Terraform state..."
            aws s3api create-bucket \
              --bucket delima-aippointment-terraform-state \
              --region us-west-2 \
              --create-bucket-configuration LocationConstraint=us-west-2
            
            aws s3api put-bucket-versioning \
              --bucket delima-aippointment-terraform-state \
              --versioning-configuration Status=Enabled
              
            aws s3api put-bucket-encryption \
              --bucket delima-aippointment-terraform-state \
              --server-side-encryption-configuration '{"Rules": [{"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}]}'
          else
            echo "S3 bucket for Terraform state already exists"
          fi
          
          # Check if the DynamoDB table exists
          if ! aws dynamodb describe-table --table-name terraform-state-lock 2>/dev/null; then
            echo "Creating DynamoDB table for Terraform state locking..."
            aws dynamodb create-table \
              --table-name terraform-state-lock \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --provisioned-throughput ReadCapacityUnits=1,WriteCapacityUnits=1 \
              --region us-west-2
          else
            echo "DynamoDB table for Terraform state locking already exists"
          fi

      - name: Terraform Init and Apply
        run: |
          cd infrastructure/global/terraform
          terraform init
          terraform apply -auto-approve
