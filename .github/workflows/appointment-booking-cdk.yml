name: AIppointment CDK Deployment

on:
  push:
    branches: [main, migrate-to-cdk]
    paths:
      - 'infrastructure/cdk/**'
      - 'functions/appointment-booking/**'
      - '.github/workflows/appointment-booking-cdk.yml'
  workflow_dispatch:

env:
  # Common variables
  PROJECT_NAME: aippointment
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  # Default environment is used for pull requests
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
  # WhatsApp integration - using GitHub variables to avoid exposing secrets
  WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID }}
  # Bedrock Agent
  FOUNDATION_MODEL_ID: anthropic.claude-3-haiku-20240307-v1:0

jobs:
  cdk_deploy:
    name: Deploy with CDK
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC
      contents: read    # Required to checkout the repository
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install CDK CLI
        run: |
          npm install -g aws-cdk@2.103.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AWS CLI and CDK Dependencies
        run: |
          pip install awscli
          cd infrastructure/cdk
          pip install -r requirements.txt
          pip install -e .

      - name: Create Environment Context File
        run: |
          cd infrastructure/cdk
          cat > cdk.context.json <<EOF
          {
            "environment": "${{ env.ENVIRONMENT }}",
            "projectName": "${{ env.PROJECT_NAME }}",
            "whatsappPhoneNumberId": "${{ vars.WHATSAPP_PHONE_NUMBER_ID }}",
            "whatsappWebhookVerifyToken": "${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}",
            "foundationModelId": "${{ env.FOUNDATION_MODEL_ID }}"
          }
          EOF
          
      - name: Bootstrap CDK (if needed)
        run: |
          cd infrastructure/cdk
          cdk bootstrap aws://${{ env.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}

      - name: Deploy CDK Stack
        run: |
          cd infrastructure/cdk
          cdk deploy --app "python app.py" --require-approval never --context environment=${{ env.ENVIRONMENT }}

      - name: Extract and Display Stack Outputs
        run: |
          cd infrastructure/cdk 
          echo "BEDROCK_AGENT_ID=$(cdk output --context environment=${{ env.ENVIRONMENT }} AIppointmentStack:BedrockAgentId)" >> $GITHUB_ENV
          echo "BEDROCK_AGENT_ALIAS_ID=$(cdk output --context environment=${{ env.ENVIRONMENT }} AIppointmentStack:BedrockAgentAliasId)" >> $GITHUB_ENV
          echo "API_GATEWAY_URL=$(cdk output --context environment=${{ env.ENVIRONMENT }} AIppointmentStack:ApiGatewayUrl)" >> $GITHUB_ENV
          
          echo "✅ Deployment has been applied and validated"
          echo "BEDROCK_AGENT_ID: ${{ env.BEDROCK_AGENT_ID }}"
          echo "BEDROCK_AGENT_ALIAS_ID: ${{ env.BEDROCK_AGENT_ALIAS_ID }}"
          echo "API_GATEWAY_URL: ${{ env.API_GATEWAY_URL }}"