name: AWS CDK Deployment

on:
  push:
    branches: [main, migrate-to-cdk]
    paths:
      - 'infrastructure/cdk/**'
      - 'functions/appointment-booking/**'
      - '.github/workflows/appointment-booking-cdk.yml'
  workflow_dispatch:

env:
  PROJECT_NAME: aippointment
  AWS_REGION: us-west-2
  CDK_VERSION: 2.103.0
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

jobs:
  deploy:
    name: Deploy with CDK
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Use Node.js LTS version (18.x)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      # Set up Python for CDK dependencies
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # Using 3.10 for better compatibility
          cache: 'pip'

      # Install AWS CDK globally
      - name: Install AWS CDK CLI
        run: npm install -g aws-cdk@${{ env.CDK_VERSION }}
          
      # Install Python dependencies
      - name: Install Python dependencies
        working-directory: infrastructure/cdk
        run: |
          python -m pip install --upgrade pip
          # Required for jsii
          pip install wheel setuptools
          # Install dependencies
          pip install -r requirements.txt
          pip install -e .
          # Verify constructs module is installed
          pip list | grep constructs

      # Create CDK context file
      - name: Create Environment Context File
        working-directory: infrastructure/cdk
        run: |
          cat > cdk.context.json <<EOF
          {
            "environment": "${{ env.ENVIRONMENT }}",
            "projectName": "${{ env.PROJECT_NAME }}",
            "whatsappPhoneNumberId": "${{ vars.WHATSAPP_PHONE_NUMBER_ID }}",
            "whatsappWebhookVerifyToken": "${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}",
            "foundationModelId": "anthropic.claude-3-haiku-20240307-v1:0"
          }
          EOF

      # CDK Bootstrap
      - name: CDK Bootstrap
        working-directory: infrastructure/cdk
        run: |
          cdk bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}

      # Run a CDK synth to confirm it works (and to debug any issues)
      - name: CDK Synth
        working-directory: infrastructure/cdk
        run: |
          cdk synth --context environment=${{ env.ENVIRONMENT }}

      # Deploy the CDK stack
      - name: CDK Deploy
        working-directory: infrastructure/cdk
        run: |
          cdk deploy --app "python app.py" --require-approval never --context environment=${{ env.ENVIRONMENT }}

      # Output CDK stack outputs
      - name: Output CDK Stack Information
        working-directory: infrastructure/cdk
        run: |
          echo "BEDROCK_AGENT_ID=$(cdk output --context environment=${{ env.ENVIRONMENT }} AIppointmentStack:BedrockAgentId)" >> $GITHUB_ENV
          echo "BEDROCK_AGENT_ALIAS_ID=$(cdk output --context environment=${{ env.ENVIRONMENT }} AIppointmentStack:BedrockAgentAliasId)" >> $GITHUB_ENV
          echo "API_GATEWAY_URL=$(cdk output --context environment=${{ env.ENVIRONMENT }} AIppointmentStack:ApiGatewayUrl)" >> $GITHUB_ENV
          
          echo "✅ Deployment Complete - Infrastructure Details:"
          echo "BEDROCK_AGENT_ID: ${{ env.BEDROCK_AGENT_ID }}"
          echo "BEDROCK_AGENT_ALIAS_ID: ${{ env.BEDROCK_AGENT_ALIAS_ID }}"
          echo "API_GATEWAY_URL: ${{ env.API_GATEWAY_URL }}"